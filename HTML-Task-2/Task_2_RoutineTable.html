<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width , initial-scale=0.1">
        <title>Daily Routine</title> 
        <style>
            table {
                width: 100%;
                text-align: center;
                border-collapse: collapse;
                font-family: Arial, Helvetica, sans-serif;
            }
            td,th{
                padding: 8px;
                border: 1px solid black;
            }
            .header_td{
                
                font-weight: bold;
                background-color: #dddddd;
            }

        </style>
    </head>
    <body>
        <h1>My Daily Flow</h1>
        <table>
            <thead>
                <tr>
                    <th class="header_td" colspan="3">Daily Routine</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="7">Timing And Tasks</td>
                    <td>7 : 00</td>
                    <td>Wake Up</td>
                </tr>
                <tr>
                    <td colspan="2">BreakFast</td>
                </tr>
                <tr>
                    <td>9 : 30</td>
                    <td>Come To Office</td>
                    
                </tr>
                <tr>
                    <td colspan="2">Lunch Break</td>
                    
                </tr>
                <tr>
                    <td>7 : 00</td>
                    <td>Get Back To Home After Some Hard Work</td>
                    
                </tr>
                <tr>
                    <td colspan="2">Dinner</td>
                    
                </tr>                            
                <tr>
                    <td>10 : 00</td>
                    <td>Sleep</td>
                </tr>
                
            </tbody>
        </table>
    </body>
</html>
